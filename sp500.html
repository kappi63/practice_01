        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #21262d;
            border-radius: 20px;
            transition: 0.3s;
            border: 1px solid #30363d;
        }
        .slider::before {
            content: "";

            width: 14px; height: 14px;
            left: 2px; bottom: 2px;
            background: #8b949e;
            border-radius: 50%;
            transition: 0.3s;
        }

            font-size: 0.75rem;

        function setRange(years, btn) {
            document.querySelectorAll(".range-btn").forEach(b => b.classList.remove("active"));

                Plotly.relayout("chart", { "xaxis.autorange": true });

                const end = new Date();
                const start = new Date();
                start.setFullYear(end.getFullYear() - years);
                Plotly.relayout("chart", {

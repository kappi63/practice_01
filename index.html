  thead th {

    top: 0;
    cursor: pointer;

    font-weight: 600;

  .calc input {

    border-radius: 6px;
    background: var(--panel);

</main>

function rg(I, A) { return Math.round(Math.sqrt(I / A) * 100) / 100; } // 回転半径 cm
function sig(v) { // 有効数字3桁程度に丸め
  if (v === 0) return 0;
  const d = Math.ceil(Math.log10(Math.abs(v)));
  const p = Math.pow(10, 3 - d);
  return Math.round(v * p) / p;
}

      ["A","断面積","cm²"],["W","単位質量","kg/m"],
      ["I","I","cm⁴"],["Z","Z","cm³"],["i","i","cm"],
    ],
  },
  {
    id: "ch", label: "溝形鋼", data: CHANNEL,
    catName: "溝形鋼(JIS G 3192)",
    cols: [
      ["name","呼称寸法","mm"],["t1","t₁","mm"],["t2","t₂","mm"],
      ["A","断面積","cm²"],["W","単位質量","kg/m"],
      ["Ix","Ix","cm⁴"],["Iy","Iy","cm⁴"],
      ["Zx","Zx","cm³"],["Zy","Zy","cm³"],
    ],
  },
  {
    id: "an", label: "山形鋼", data: ANGLE,
    catName: "等辺山形鋼(JIS G 3192)",
    cols: [
      ["name","呼称寸法","mm"],["t","板厚","mm"],
      ["A","断面積","cm²"],["W","単位質量","kg/m"],
      ["I","I","cm⁴"],["Z","Z","cm³"],["i","i","cm"],
    ],
  },
  {
    id: "mat", label: "材料規格", data: MATERIAL,
    catName: "材料規格",
    cols: [
      ["name","記号",""],["std","規格",""],
      ["yp","降伏点・耐力","N/mm²"],["ts","引張強さ","N/mm²"],
      ["F","F値(t≤40)","N/mm²"],["note","備考",""],
    ],
  },
];

/* ---------- 状態 ---------- */
let current = CATEGORIES[0];
let sortKey = null;
let sortAsc = true;

const $tabs = document.getElementById("tabs");
const $search = document.getElementById("search");
const $thead = document.querySelector("#table thead");
const $tbody = document.querySelector("#table tbody");
const $count = document.getElementById("count");

/* ---------- タブ ---------- */
CATEGORIES.forEach(cat => {
  const b = document.createElement("button");
  b.className = "tab";
  b.textContent = cat.label;
  b.onclick = () => {
    current = cat;
    sortKey = null;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    b.classList.add("active");
    render();
  };
  $tabs.appendChild(b);
});
$tabs.firstChild.classList.add("active");

/* ---------- 検索 ---------- */
function normalize(s) {
  return String(s)
    .toLowerCase()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[×✕✖*ｘx]/g, "x")
    .replace(/[‐－ーｰ\-]/g, "-")
    .replace(/\s+/g, "");
}
function matches(row, terms) {
  if (!terms.length) return true;
  const hay = normalize(Object.values(row).join(" "));
  return terms.every(t => hay.includes(t));
}
$search.addEventListener("input", render);

/* ---------- 描画 ---------- */
function render() {
  const cols = current.cols;
  $thead.innerHTML = "";
  const tr = document.createElement("tr");
  cols.forEach(([key, label, unit]) => {
    const th = document.createElement("th");
    th.innerHTML = label + (unit ? `<span class="unit">${unit}</span>` : "");
    if (sortKey === key) {
      th.classList.add("sorted");
      th.innerHTML += sortAsc ? " ▲" : " ▼";
    }
    th.onclick = () => {
      if (sortKey === key) { sortAsc = !sortAsc; }
      else { sortKey = key; sortAsc = true; }
      render();
    };
    tr.appendChild(th);
  });
  $thead.appendChild(tr);

  const terms = normalize($search.value).split(/[,、\s]+/).filter(Boolean);
  let rows = current.data.filter(r => matches(r, terms));

  if (sortKey) {
    rows = [...rows].sort((a, b) => {
      const va = a[sortKey], vb = b[sortKey];
      if (typeof va === "number" && typeof vb === "number") {
        return sortAsc ? va - vb : vb - va;
      }
      return sortAsc
        ? String(va ?? "").localeCompare(String(vb ?? ""), "ja")
        : String(vb ?? "").localeCompare(String(va ?? ""), "ja");
    });
  }

  $tbody.innerHTML = "";
  if (!rows.length) {
    $tbody.innerHTML = `<tr><td class="empty" colspan="${cols.length}" style="text-align:center">該当する鋼材がありません</td></tr>`;
  }
  rows.forEach(row => {
    const tr = document.createElement("tr");
    cols.forEach(([key]) => {
      const td = document.createElement("td");
      const v = row[key];
      td.textContent = v == null ? "−" : (typeof v === "number" ? fmt(v) : v);
      tr.appendChild(td);
    });
    tr.onclick = () => openModal(row);
    $tbody.appendChild(tr);
  });
  $count.textContent = `${rows.length} / ${current.data.length} 件`;
}

function fmt(v) {
  return v.toLocaleString("ja-JP", { maximumFractionDigits: 3 });
}

/* ---------- 詳細モーダル ---------- */
const $overlay = document.getElementById("overlay");
let modalRow = null;

function openModal(row) {
  modalRow = row;
  document.getElementById("m-title").textContent = row.name;
  document.getElementById("m-cat").textContent = current.catName;
  const $props = document.getElementById("m-props");
  $props.innerHTML = "";
  current.cols.forEach(([key, label, unit]) => {
    if (key === "name") return;
    const v = row[key];
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${label}</td><td>${v == null ? "−" : (typeof v === "number" ? fmt(v) : v)}${unit && v != null ? " " + unit : ""}</td>`;
    $props.appendChild(tr);
  });
  document.querySelector(".calc").style.display = ("W" in row) ? "" : "none";
  $overlay.classList.add("show");
  updateCalc();
}
function closeModal() { $overlay.classList.remove("show"); }
$overlay.addEventListener("click", e => { if (e.target === $overlay) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function updateCalc() {
  if (!modalRow || !("W" in modalRow)) return;
  const len = parseFloat(document.getElementById("calc-len").value) || 0;
  const num = parseInt(document.getElementById("calc-num").value) || 0;
  const kg = modalRow.W * len * num;
  document.getElementById("calc-result").textContent =
    `重量: ${fmt(Math.round(kg * 10) / 10)} kg（${fmt(Math.round(kg / 1000 * 1000) / 1000)} t）`;
}
document.getElementById("calc-len").addEventListener("input", updateCalc);
document.getElementById("calc-num").addEventListener("input", updateCalc);

render();
</script>
</body>
